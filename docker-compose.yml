services:

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gespromag}
      DB_USER: ${DB_USER:-gespromag}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      THYMELEAF_CACHE: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gespromag.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gespromag}
      POSTGRES_USER: ${DB_USER:-gespromag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gespromag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
