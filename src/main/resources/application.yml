server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: gespromag
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gespromag}
    username: ${DB_USER:gespromag}
    password: ${DB_PASSWORD:gespromag}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@gespromag.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

logging:
  level:
    com.gespromag: INFO
