<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
  <title>Modifier le produit</title>
</head>
<body>
<th:block layout:fragment="pageTitle">Modifier le produit</th:block>

<div layout:fragment="content">

  <div class="card" style="max-width: 720px;">
    <div th:if="${errorMessage}" class="alert alert-danger">
      <i class="fa fa-exclamation-circle"></i>&nbsp;<span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/products/{id}(id=${productId})}" th:object="${productForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-section">
        <label class="form-label">Nom *</label>
        <input type="text" class="form-control" th:field="*{name}" maxlength="200" required/>
        <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">SKU *</label>
        <input type="text" class="form-control" th:field="*{sku}" maxlength="100" required/>
        <span class="form-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
      </div>

      <div class="form-section">
        <label class="form-label">Categorie *</label>
        <select class="form-control" th:field="*{categoryId}" required>
          <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
        </select>
        <span class="form-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
      </div>

      <div class="form-section" style="display:flex; gap: 16px;">
        <div style="flex:1;">
          <label class="form-label">Prix d'achat *</label>
          <input type="number" step="0.01" min="0" class="form-control" th:field="*{purchasePrice}" required/>
          <span class="form-error" th:if="${#fields.hasErrors('purchasePrice')}" th:errors="*{purchasePrice}"></span>
        </div>
        <div style="flex:1;">
          <label class="form-label">Prix de vente *</label>
          <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{sellingPrice}" required/>
          <span class="form-error" th:if="${#fields.hasErrors('sellingPrice')}" th:errors="*{sellingPrice}"></span>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">Seuil minimum *</label>
        <input type="number" step="1" min="0" class="form-control" th:field="*{minimumQuantity}" required/>
        <span class="form-error" th:if="${#fields.hasErrors('minimumQuantity')}" th:errors="*{minimumQuantity}"></span>
        <p style="color: var(--color-text-muted); font-size: 12px; margin-top: 4px;">
          La quantite en stock se modifie uniquement via un mouvement de stock.
        </p>
      </div>

      <div class="form-section">
        <label>
          <input type="checkbox" th:field="*{active}"/>
          Produit actif
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-accent"><i class="fa fa-check"></i>&nbsp;Enregistrer</button>
        <a th:href="@{/products}" class="btn btn-default">Annuler</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
