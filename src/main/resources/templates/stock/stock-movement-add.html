<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
  <title>Nouveau mouvement de stock</title>
</head>
<body>
<th:block layout:fragment="pageTitle">Nouveau mouvement de stock</th:block>

<div layout:fragment="content">

  <div class="card" style="max-width: 560px;">
    <div th:if="${errorMessage}" class="alert alert-danger">
      <i class="fa fa-exclamation-circle"></i>&nbsp;<span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/stock/movements}" th:object="${movementForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-section">
        <label class="form-label">Produit *</label>
        <select class="form-control" th:field="*{productId}" required>
          <option value="">-- Selectionner --</option>
          <option th:each="product : ${products}" th:value="${product.id}"
                  th:text="${product.sku} + ' — ' + ${product.name} + ' (stock : ' + ${product.quantity} + ')'"></option>
        </select>
        <span class="form-error" th:if="${#fields.hasErrors('productId')}" th:errors="*{productId}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Type de mouvement *</label>
        <select class="form-control" th:field="*{type}" required>
          <option th:each="t : ${movementTypes}" th:value="${t}" th:text="${t.label}"></option>
        </select>
        <span class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Quantite *</label>
        <input type="number" step="1" min="0" class="form-control" th:field="*{quantity}" required/>
        <span class="form-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
        <p style="color: var(--color-text-muted); font-size: 12px; margin-top: 4px;">
          Entree/Sortie : quantite ajoutee ou retiree. Ajustement : nouvelle quantite exacte du stock
          (par exemple apres un inventaire physique).
        </p>
      </div>

      <div class="form-section">
        <label class="form-label">Commentaire</label>
        <textarea class="form-control" rows="2" th:field="*{comment}"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-accent"><i class="fa fa-check"></i>&nbsp;Enregistrer</button>
        <a th:href="@{/stock/movements}" class="btn btn-default">Annuler</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
