<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
  <title>Modifier la categorie</title>
</head>
<body>
<th:block layout:fragment="pageTitle">Modifier la categorie</th:block>

<div layout:fragment="content">

  <div class="card" style="max-width: 560px;">
    <div th:if="${errorMessage}" class="alert alert-danger">
      <i class="fa fa-exclamation-circle"></i>&nbsp;<span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/categories/{id}(id=${categoryId})}" th:object="${categoryForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-section">
        <label class="form-label">Nom *</label>
        <input type="text" class="form-control" th:field="*{name}"
               th:errorclass="input-error" maxlength="150" required/>
        <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
      </div>

      <div class="form-section">
        <label>
          <input type="checkbox" th:field="*{active}"/>
          Categorie active
        </label>
        <p style="color: var(--color-text-muted); font-size: 12px; margin-top: 4px;">
          Une categorie contenant encore des produits actifs ne peut pas etre desactivee.
        </p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-accent"><i class="fa fa-check"></i>&nbsp;Enregistrer</button>
        <a th:href="@{/categories}" class="btn btn-default">Annuler</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
