<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
  <title>Modifier l'utilisateur</title>
</head>
<body>
<th:block layout:fragment="pageTitle">Modifier l'utilisateur</th:block>

<div layout:fragment="content">

  <div class="card" style="max-width: 560px;">
    <div th:if="${errorMessage}" class="alert alert-danger">
      <i class="fa fa-exclamation-circle"></i>&nbsp;<span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/users/{id}(id=${userId})}" th:object="${userForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-section">
        <label class="form-label">Nom d'utilisateur *</label>
        <input type="text" class="form-control" th:field="*{username}" maxlength="100" required/>
        <span class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" th:field="*{email}" required/>
        <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>

      <div class="form-section">
        <label class="form-label">Nouveau mot de passe</label>
        <input type="password" class="form-control" th:field="*{newPassword}" minlength="8"
               placeholder="Laisser vide pour ne pas modifier"/>
      </div>

      <div class="form-section">
        <label class="form-label">Role *</label>
        <select class="form-control" th:field="*{role}" required>
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>
        <span class="form-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
      </div>

      <div class="form-section">
        <label>
          <input type="checkbox" th:field="*{active}"/>
          Compte actif
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-accent"><i class="fa fa-check"></i>&nbsp;Enregistrer</button>
        <a th:href="@{/users}" class="btn btn-default">Annuler</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
